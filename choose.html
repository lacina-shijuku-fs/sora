<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/jpeg" href="favicon.jpg">
<title>どちらを使いますか？｜探求テーマ発見ワークシート</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="app-header"></div>

  <div class="card">
    <h2 id="welcome"></h2>
    <p class="lead">どちらのワークシートを使いますか？</p>
  </div>

  <div class="intro-buttons">
    <a class="btn btn-primary" href="index.html">中学生・高校生向け</a>
  </div>
  <div class="intro-buttons">
    <a class="btn btn-primary" href="elementary/">小学生向け</a>
  </div>
  <div class="intro-buttons">
    <a class="btn btn-ghost" href="mypage.html">自分の結果を見る</a>
  </div>
  <div class="intro-buttons">
    <button type="button" class="btn btn-ghost" id="logout-btn" style="opacity:.7;">ログアウト</button>
  </div>
</div>

<script src="app.js"></script>
<script>
  renderHeader(0, { labels: ["はじめに"], total: 1 });
  const auth = requireStudentAuth();
  if (auth) {
    document.getElementById("welcome").textContent = `ようこそ、${auth.name}さん`;
    document.getElementById("logout-btn").addEventListener("click", logout);
  }
</script>
</body>
</html>
