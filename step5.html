<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/jpeg" href="favicon.jpg">
<title>STEP5 問いづくり｜探求テーマ発見ワークシート</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="app-header"></div>

  <div class="card">
    <h2>STEP5　「テーマ」を「探究の問い」に変えよう！</h2>
    <p class="lead">「AI」「音楽」「環境問題」はテーマです。探究では、そこから"自分が確かめたいこと"を問いの形にすると調べやすくなります。</p>

    <h3 style="font-size:.95rem;">使いやすい「問いの型」（参考にしてみよう）</h3>
    <ul class="type-ref-list" id="type-list"></ul>
  </div>

  <div class="card">
    <p class="lead">問いの候補を3つつくってみよう！</p>
    <label class="field">1.
      <input type="text" id="q1">
    </label>
    <label class="field">2.
      <input type="text" id="q2">
    </label>
    <label class="field">3.
      <input type="text" id="q3">
    </label>
  </div>

  <div id="nav"></div>
</div>

<script src="app.js"></script>
<script>
  renderHeader(5);
  const state = loadState();
  if (!state.scores) goTo("step1.html");

  document.getElementById("type-list").innerHTML = QUESTION_TYPES.map(t => `<li>${t}</li>`).join("");

  document.getElementById("q1").value = state.step5.questions[0] || "";
  document.getElementById("q2").value = state.step5.questions[1] || "";
  document.getElementById("q3").value = state.step5.questions[2] || "";

  navButtons("nav", {
    prevHref: "step4.html",
    nextLabel: "次へ →",
    onNext: () => {
      state.step5.questions = [
        document.getElementById("q1").value.trim(),
        document.getElementById("q2").value.trim(),
        document.getElementById("q3").value.trim()
      ];
      saveState(state);
      goTo("step6.html");
    }
  });
</script>
</body>
</html>
