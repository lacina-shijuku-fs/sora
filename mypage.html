<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/jpeg" href="favicon.jpg">
<title>自分の結果｜探求テーマ発見ワークシート</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="app-header"></div>

  <div class="card">
    <h2>自分の結果</h2>
    <p class="lead" id="status-line">読み込み中...</p>
    <div id="result-area" style="display:none;">
      <p class="hint" id="profile-line"></p>
      <div class="hexagon-wrap"><div id="hexagon" class="hex-box"></div></div>
      <div class="summary-box" id="summary"></div>
    </div>
  </div>

  <div class="final-actions">
    <a class="btn btn-ghost" href="choose.html">ワークシートへ戻る</a>
    <button type="button" class="btn btn-ghost" id="logout-btn">ログアウト</button>
  </div>
</div>

<script src="app.js"></script>
<script>
  renderHeader(0);
  const auth = requireStudentAuth();

  if (auth) {
    document.getElementById("logout-btn").addEventListener("click", logout);

    apiCall("get_my_result", { name: auth.name, password: auth.password }).then(result => {
      const statusEl = document.getElementById("status-line");
      if (!result.ok) {
        statusEl.textContent = result.error === "まだ提出されていません"
          ? "まだ結果を提出していません。ワークシートを最後まで進めてから、もう一度確認してください。"
          : `結果を読み込めませんでした（${result.error || "不明なエラー"}）。`;
        return;
      }
      statusEl.style.display = "none";
      const record = result.record;
      document.getElementById("result-area").style.display = "block";
      document.getElementById("profile-line").textContent =
        `名前：${record.名前 || "-"}　学年：${record.学年 || "-"}　日付：${record.日付 || "-"}`;
      const isES = record.トラック === "小学生";
      renderHexagon(document.getElementById("hexagon"), scoresFromRecord(record), {
        maxVal: isES ? 10 : 25,
        categories: isES ? ES_CATEGORIES : CATEGORIES
      });
      document.getElementById("summary").textContent = record.サマリー || "";
    });
  }
</script>
</body>
</html>
