<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/jpeg" href="favicon.jpg">
<title>STEP6 仕上げ｜探求テーマ発見ワークシート</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="app">
  <div id="app-header"></div>

  <div class="card">
    <h2>STEP6　問いの「探究しやすさ」をチェック</h2>
    <div class="check-list" id="checklist"></div>
  </div>

  <div class="card">
    <p class="lead">最初にできそうな「調べ方」</p>
    <div class="chip-grid" id="methods"></div>
  </div>

  <div class="card">
    <label class="field">最初の一歩：今日／次回までに、まず何をする？
      <textarea id="firstAction"></textarea>
    </label>
  </div>

  <div class="card" id="result-card" style="display:none;">
    <div class="done-banner" id="done-banner" style="display:none;">保存しました！お疲れさまでした。</div>
    <h2>結果まとめ</h2>
    <div id="pdf-area-step6">
      <p class="hint" id="profile-line-final"></p>
      <div class="hexagon-wrap"><div id="hexagon-final" class="hex-box"></div></div>
      <div class="summary-box" id="summary"></div>
    </div>
    <div class="final-actions">
      <button type="button" class="btn btn-primary" id="download-btn">グラフと回答をPDFでダウンロード</button>
      <button type="button" class="btn btn-ghost" id="print-btn">印刷する</button>
      <button type="button" class="btn btn-ghost" id="restart-btn">最初からやり直す</button>
      <button type="button" class="btn btn-ghost" id="finish-btn">終了する</button>
    </div>
  </div>

  <div id="nav"></div>
</div>

<script src="app.js"></script>
<script>
  renderHeader(6);
  const auth = requireStudentAuth();
  const state = loadState();
  if (!state.scores) goTo("step1.html");

  document.getElementById("checklist").innerHTML = CHECKLIST_ITEMS.map((item, i) => `
    <label>
      <input type="checkbox" data-idx="${i}" ${state.step6.checklist[i] ? "checked" : ""}>
      <span>${item}</span>
    </label>
  `).join("");

  document.getElementById("methods").innerHTML = RESEARCH_METHODS.map(m => `
    <label class="chip">
      <input type="checkbox" value="${m}" ${state.step6.methods.includes(m) ? "checked" : ""}>
      <span class="chip-label">${m}</span>
    </label>
  `).join("");
  document.querySelectorAll("#methods .chip input").forEach(input => {
    const labelEl = input.nextElementSibling;
    const apply = () => {
      labelEl.style.background = input.checked ? "#4f9bc4" : "";
      labelEl.style.color = input.checked ? "#fff" : "";
    };
    apply();
    input.addEventListener("change", apply);
  });

  document.getElementById("firstAction").value = state.step6.firstAction;

  navButtons("nav", {
    prevHref: "step5.html",
    nextLabel: "仕上げる →"
  });

  document.getElementById("nav-next-btn").addEventListener("click", async () => {
    if (!auth) return;
    state.step6.checklist = Array.from(document.querySelectorAll("#checklist input")).map(i => i.checked);
    state.step6.methods = Array.from(document.querySelectorAll("#methods input:checked")).map(i => i.value);
    state.step6.firstAction = document.getElementById("firstAction").value.trim();
    saveState(state);

    document.getElementById("profile-line-final").textContent =
      `名前：${state.profile.name || "-"}　学年：${state.profile.grade || "-"}　日付：${state.profile.date || "-"}`;
    renderHexagon(document.getElementById("hexagon-final"), state.scores);
    document.getElementById("summary").textContent = buildSummaryText(state);
    document.getElementById("result-card").style.display = "block";
    document.getElementById("result-card").scrollIntoView({ behavior: "smooth" });

    const doneBanner = document.getElementById("done-banner");
    doneBanner.style.display = "block";
    doneBanner.textContent = "送信中...";
    const result = await submitAnswer(auth, state);
    doneBanner.textContent = result.ok
      ? "送信しました！お疲れさまでした。（下からもダウンロード・印刷できます）"
      : `送信に失敗しました（${result.error || "不明なエラー"}）。下からダウンロードして保存してください。`;
  });

  document.getElementById("download-btn").addEventListener("click", async () => {
    const btn = document.getElementById("download-btn");
    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = "作成中...";
    const namePart = state.profile.name ? state.profile.name.replace(/\s+/g, "") : "result";
    try {
      await elementToPdf(document.getElementById("pdf-area-step6"), `探求テーマ_結果_${namePart}.pdf`);
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  });
  document.getElementById("print-btn").addEventListener("click", () => window.print());
  document.getElementById("restart-btn").addEventListener("click", () => {
    if (confirm("入力した内容をすべて消して最初からやり直しますか？")) {
      resetState();
      goTo("index.html");
    }
  });

  document.getElementById("finish-btn").addEventListener("click", () => {
    if (confirm("終了しますか？（この端末から自分の回答は消え、ログアウトします）")) {
      resetState();
      logout();
    }
  });
</script>
</body>
</html>
